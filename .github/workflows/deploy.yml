name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck (client and worker)
        run: npm run check

      - name: Unit tests (core machinery)
        run: npm test

      - name: Build
        run: npm run build

      # Acceptance criterion: zero secrets in the client bundle. This runs
      # before deploy so a leaked key fails the pipeline instead of shipping.
      - name: Audit built bundle for secrets
        run: npm run audit:bundle

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Audit built bundle for secrets
        run: npm run audit:bundle

      # Wrangler's own failure for a missing token says only "set
      # CLOUDFLARE_API_TOKEN", which is indistinguishable between "the secret
      # does not exist", "it is named differently", "it was added under
      # Variables rather than Secrets", and "it is scoped to an Environment
      # this job does not declare". This step names which of those it is.
      #
      # The values are read as env vars, never interpolated into the script:
      # interpolating a secret into a shell command is how secrets end up in
      # logs. Only presence and length are reported, never content.
      - name: Check Cloudflare credentials are visible to this job
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok=1
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty in this job. Check it is a repository *Secret* (not a Variable), spelled exactly, in this repo, and not scoped to an Environment."
            ok=0
          else
            echo "CLOUDFLARE_API_TOKEN: present (${#CF_TOKEN} characters)"
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty in this job. Same checks as above."
            ok=0
          else
            echo "CLOUDFLARE_ACCOUNT_ID: present (${#CF_ACCOUNT} characters)"
          fi
          [ "$ok" = 1 ]

      - name: Deploy Worker (static assets + routes)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Uploaded to the Worker as secrets, never committed and never in the
          # client bundle. NOTES_TOKEN gates the notebook's write endpoint; with
          # it unset the Worker refuses writes rather than leaving an open one.
          secrets: |
            NOTES_TOKEN
        env:
          NOTES_TOKEN: ${{ secrets.NOTES_TOKEN }}

      # A green deploy step means "wrangler uploaded it", not "the site works".
      # This checks the deployed origin actually serves BOTH halves of the
      # hosting model — static assets and a Worker route — from one host, which
      # is the claim the whole architecture rests on.
      - name: Smoke-test the deployed origin
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::The deploy step reported no URL, so there is nothing to verify. Refusing to report success."
            exit 1
          fi
          echo "Testing $URL"
          fail=0

          # 1. The static bundle.
          code=$(curl -sS -o /tmp/root.html -w '%{http_code}' --max-time 30 "$URL/")
          if [ "$code" != "200" ]; then echo "::error::GET / returned $code"; fail=1; fi
          grep -q "<div id=\"app\">" /tmp/root.html || { echo "::error::GET / did not return the app shell"; fail=1; }

          # 2. The Worker route, on the same origin.
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "$URL/api/health")
          if [ "$code" != "200" ]; then echo "::error::GET /api/health returned $code"; fail=1; fi
          grep -q '"runtime": "cloudflare"' /tmp/health.json || { echo "::error::/api/health did not report the cloudflare runtime"; cat /tmp/health.json; fail=1; }

          # 3. An unknown route is an honest 404, not an empty success.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL/api/does-not-exist")
          if [ "$code" != "404" ]; then echo "::error::GET /api/does-not-exist returned $code, expected 404"; fail=1; fi

          if [ "$fail" = 0 ]; then echo "Deployed origin serves assets and Worker routes correctly."; fi
          exit $fail
